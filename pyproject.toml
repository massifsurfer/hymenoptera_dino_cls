[project]
name = "hymenoptera-dino-cls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "faker>=40.19.1",
    "hydra-core>=1.3.2",
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "kaggle>=2.1.0",
    "kagglehub>=1.0.1",
    "lightning>=2.6.1",
    "mlflow>=3.11.1",
    "numpy>=2.4.3",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "onnxscript>=0.7.0",
    "polars>=1.40.1",
    "pre-commit>=4.6.0",
    "streamlit>=1.57.0",
    "tensorrt>=11.0.0.114",
    "tensorrt-cu12>=11.0.0.114",
    "timm>=1.0.27",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "ipywidgets>=8.1.8",
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]


[tool.ruff]
line-length = 88
target-version = "py310"
fixable = ["ALL"]
unfixable = []
select = ["E", "F", "B", "C4", "I", "N", "S", "UP", "W", "RUF"]
ignore = ["E501", "RUF001", "RUF003", "N812", "E402", "S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
